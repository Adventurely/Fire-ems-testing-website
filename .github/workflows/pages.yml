# Publishes the site to GitHub Pages on every push to main.
#
# This deploys by pushing the built site to the gh-pages branch, rather than
# using actions/deploy-pages. The Pages REST API refuses GITHUB_TOKEN with
# "Resource not accessible by integration" on this repo, so the API-based
# flow cannot create or update the Pages site. Pushing a branch only needs
# contents: write, which the workflow token does have.
#
# Pages is configured to serve from gh-pages (root). Don't edit that branch
# by hand - this workflow force-pushes over it.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

# Let a running deploy finish rather than cancelling it mid-publish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The site is plain static files - no build step. Ship the repo root
      # minus the things that should not be served.
      - name: Stage site
        run: |
          mkdir -p _site
          rsync -a --exclude '.git' --exclude '.github' --exclude 'build' \
                --exclude 'scripts' --exclude 'README.md' --exclude '_site' \
                ./ _site/
          # Tell Pages to serve the files as-is instead of running Jekyll.
          touch _site/.nojekyll

      - name: Publish to gh-pages
        run: |
          cd _site
          git init -q
          git checkout -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Deploy ${GITHUB_SHA::7} from main"
          git push -q --force \
            "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
            gh-pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
